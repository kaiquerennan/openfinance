services:
  - type: web
    name: finance-app
    runtime: node
    plan: free
    rootDir: finance-app
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PLUGGY_CLIENT_ID
        sync: false
      - key: PLUGGY_CLIENT_SECRET
        sync: false
      - key: PLUGGY_BASE_URL
        value: https://api.pluggy.ai
      - key: PLUGGY_CLIENT_USER_ID
        value: me
      - key: PLUGGY_WEBHOOK_SECRET
        sync: false
      - key: SYNC_TRIGGER_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
